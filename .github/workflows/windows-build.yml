name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    # Pin to windows-2022 (VS 17). windows-latest now uses VS 2025 (v18),
    # whose CMake install phase is incompatible with Flutter's Windows build.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Bundle VC Runtime DLLs and Package
        run: powershell -ExecutionPolicy Bypass -File .\package_windows.ps1 -SkipBuild

      - name: Upload Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Caskly-POS-Windows-Installer
          path: build/windows/installer/*.exe
          if-no-files-found: ignore

      - name: Upload Portable Zero-Install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Caskly-POS-Windows-Portable-ZIP
          path: build/dist/*.zip

      - name: Upload Raw Release Folder
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-raw
          path: build/windows/x64/runner/Release/
