name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    # Pin to windows-2022 (VS 17). windows-latest now uses VS 2025 (v18),
    # whose CMake install phase is incompatible with Flutter's Windows build.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Bundle VC Runtime DLLs and Package Portable ZIP
        run: powershell -ExecutionPolicy Bypass -File .\package_windows.ps1 -SkipBuild

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: build/dist/*.zip
